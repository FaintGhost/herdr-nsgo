name: Build & Release Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.5; empty = auto 1.0.<run_number>)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Go Tests (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run test suite
        run: go test -race ./...

  release-android:
    name: Build & Publish Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine release version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} (version ${VERSION})"

      - name: Restore Android signing key
        env:
          ANDROID_DEBUG_PEM_B64: ${{ secrets.ANDROID_DEBUG_PEM_B64 }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_DEBUG_PEM_B64" ]]; then
            mkdir -p .nsgo/android
            printf '%s' "$ANDROID_DEBUG_PEM_B64" | base64 -d > .nsgo/android/debug.pem
            chmod 600 .nsgo/android/debug.pem
          fi

      - name: Generate release notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## herdr-nsgo ${{ steps.ver.outputs.tag }}"
            echo ""
            if [[ -n "$PREV_TAG" ]]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            else
              git log -n 10 --pretty=format:"- %s (%h)" --no-merges
            fi
            echo ""
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Build signed Android ARM64 APK & Appcast
        env:
          NSGO_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY }}
        run: |
          go tool nsgo build -target android_arm64 -version "${{ steps.ver.outputs.version }}" -ldflags "-X main.appBuildVersion=${{ steps.ver.outputs.version }}" -release-notes /tmp/release-notes.md -output dist
          cd dist/releases
          sha256sum herdr-nsgo-${{ steps.ver.outputs.version }}-android-arm64.apk > herdr-nsgo-${{ steps.ver.outputs.version }}-android-arm64.apk.sha256
          ls -lh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.version }}"
          ASSETS=(
            "dist/releases/herdr-nsgo-${VER}-android-arm64.apk"
            "dist/releases/herdr-nsgo-${VER}-android-arm64.apk.sha256"
          )
          if [[ -f "dist/releases/appcast-android_arm64.xml" ]]; then
            ASSETS+=("dist/releases/appcast-android_arm64.xml")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "herdr-nsgo ${TAG}" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
